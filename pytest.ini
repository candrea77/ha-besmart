[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# PATCH 0.7 (b8): deprecations triggered by this integration's code are
# errors (warnings attributed to our modules by their stacklevel), on every
# Home Assistant version in the CI matrix.
filterwarnings =
    error::DeprecationWarning:custom_components\.besmart_thermostat.*
    error::PendingDeprecationWarning:custom_components\.besmart_thermostat.*
    error::FutureWarning:custom_components\.besmart_thermostat.*
