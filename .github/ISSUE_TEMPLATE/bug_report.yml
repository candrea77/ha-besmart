name: Bug report
description: Report a problem with the BeSMART integration
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!WARNING]
        > **Protect your account.** Before posting anything, remove your **password, e-mail/username,
        > token, user_id and wifi_box_id** (replace them with `***`).
        > Do not post screenshots of the BeSMART app account/device pages.

        The safest way to share data is the **diagnostics file**, which is
        already redacted by the integration.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "e.g. 2026.10.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: BeSMART integration version
      description: Visible in HACS or in Settings → Devices & services → BeSMART.
      placeholder: "e.g. 0.7.0"
    validations:
      required: true

  - type: input
    id: boiler_model
    attributes:
      label: Boiler model
      description: Brand and model of the boiler (and thermostat, if relevant).
      placeholder: "e.g. Beretta Mynute X 30 C + BeSMART thermostat"
    validations:
      required: true

  - type: dropdown
    id: setup_type
    attributes:
      label: Setup type
      options:
        - Thermostat(s) + boiler
        - Thermostat(s) only
        - Boiler only
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Set ...
        3. See error
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file (recommended)
      description: |
        Settings → Devices & services → BeSMART → ⋮ → **Download diagnostics**,
        then drag & drop the file here. Credentials are removed, the user id is
        redacted and WiFi boxes appear as `box_1`, `box_2`...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Settings → System → Logs, filter for "besmart". For more detail:
        Settings → Devices & services → BeSMART → ⋮ → Enable debug logging,
        reproduce the issue, then disable it to download the log.
        The integration redacts secrets, but **check the text yourself** and
        replace any password, e-mail, token, user_id or wifi_box_id with `***`.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have removed passwords, e-mail addresses, tokens, user_id and wifi_box_id from everything I posted.
          required: true
        - label: I have updated to the latest version of the integration before reporting.
          required: true
        - label: I have checked that the BeSMART mobile app works correctly (the cloud service is up).
          required: false
