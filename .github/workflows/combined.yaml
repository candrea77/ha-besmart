name: "Validation"

on:
  push:
  pull_request:

# PATCH 0.7 (security): least-privilege token for every job.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag/branch in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  hassfest:
    name: "Hassfest validation"
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Hassfest
        uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master 2026-10-16

  hacs:
    name: "HACS validation"
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-10-16
        with:
          category: integration

  tests:
    name: "Tests (HA ${{ matrix.ha }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported version (hacs.json "homeassistant"). Pinned here,
          # not in requirements_test.txt, so Dependabot does not bump it.
          - ha: "2026.7 (minimum)"
            deps: "pytest-homeassistant-custom-component==0.13.348"
          # Latest release, kept up to date by Dependabot.
          - ha: "latest"
            deps: "-r requirements_test.txt"
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Home Assistant 2026.x requires Python >= 3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install ${{ matrix.deps }}

      - name: Run pytest
        run: python -m pytest -v tests
