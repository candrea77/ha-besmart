name: "Validation"

on:
  push:
  pull_request:

# PATCH 0.7 (security): least-privilege token for every job.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag/branch in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  hassfest:
    name: "Hassfest validation"
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Hassfest
        uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master 2026-10-16

  hacs:
    name: "HACS validation"
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-10-16
        with:
          category: integration

  tests:
    name: "Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run pytest
        run: python -m pytest -v tests
